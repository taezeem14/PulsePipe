name: spotify_newpipe
description: "PulsePipe: High-fidelity music streaming client powered purely by YouTube via NewPipe architecture for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.44
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  audio_video_progress_bar: ^2.0.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.3
  http: ^1.3.0
  provider: ^6.1.2
  font_awesome_flutter: ^11.0.0
  youtube_explode_dart: ^3.1.0
  path_provider: ^2.1.5
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/
